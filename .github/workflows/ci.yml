            start_check "gateway-watch" \
              node scripts/check-gateway-watch-regression.mjs --skip-build
          fi

          for index in "${!pids[@]}"; do
            name="${names[$index]}"
            log="${logs[$index]}"
            pid="${pids[$index]}"

            if wait "$pid"; then
              result="success"
            else
              result="failure"
            fi

            echo "::group::${name} log"
